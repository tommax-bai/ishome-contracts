# genpipe-svc 服务间 REST 契约（成文线派发入口）
# 纪律：JSON 字段 snake_case；URL 大版本；字段只增不删。
#
# 本文件与 openapi/ 下另两份的性质不同：那两份是 **BFF 对外面**，本份是 **服务间调用面**——
# project-svc（求值线，Java）→ genpipe-svc（编排，Python）。它之所以必须进契约仓而不是留在两仓各自的
# 代码里：这一跳是**跨语言**的（Java 生产报文、Python 消费），线上字段名对不上时两侧编译器都不报错，
# 只在真跑时炸成"整包解析失败"。裁决④ 定的通道形态也在此留痕。
openapi: 3.1.0
info:
  title: ishome genpipe 服务间 API
  version: 0.1.0-dev
  description: >-
    生成编排入站面。报告成文线的派发入口在此：求值线（project-svc 规则引擎，同步、不进队列）
    产出报告数据包后，经本接口交给编排侧启动 ReportComposeWorkflow。

    裁决④（2026-08-29）：派发通道**走 HTTP 入口，不用 Java Temporal SDK 直连**——直连会把
    里程碑引擎裁决刚收缩掉的 Temporal 依赖放回 Java 服务。
servers:
  - url: /api/v1/genpipe
paths:
  /reports:
    post:
      operationId: create_report_compose
      summary: 派发一份报告数据包到成文线
      description: >-
        202 = 包已交给成文线，**不是**"报告好了"。成文是一次短 run，结论经回流写回里程碑
        （状态真相不在编排侧，禁第二台状态机），不在本请求内等待。

        幂等：`report_id` 由 **project-svc 铸造**（裁决③：幂等键必须在重试的那一侧）。
        同一 `report_id` 在飞期间重复派发 → 409；调用方重试须带回同一个 `report_id`。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/report_compose_spec" }
      responses:
        "202":
          description: 已受理，回编排侧定址
          content:
            application/json:
              schema: { $ref: "#/components/schemas/workflow_start_receipt" }
        "409":
          description: 同一 report_id 已在飞（重复派发）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/error" }
  /floorplan-visuals:
    post:
      operationId: create_floorplan_visuals
      summary: 派发一张户型图到"三张免费图"生成线
      description: >-
        202 = 任务已交给编排侧，**不是**"图好了"。链路（FloorplanVisualsWorkflow）：
        勘测 + 几何提取 → 户型事实 → 批注 ∥ 页面文案 → 母版与功能说明图（render2d）→
        情绪图底图 ∥ 手账写字版风格图（imagegen）→ 情绪图叠字（render2d）→ 结果按 `result_callback_url`
        送回业务侧（task-result-deliver）。户型特征解析（floorplan-parse）与主链并行，
        产物同样交回，给报告那条腿用。

        幂等：`task_id` 由 **project-svc 铸造**（裁决③）。同一 task_id 在飞期间重复派发 → 409。
        生成侧不知用户是谁：报文里只有对象键与数字，没有身份字段（2026-09-04 新增）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/floorplan_visuals_spec" }
      responses:
        "202":
          description: 已受理，回编排侧定址
          content:
            application/json:
              schema: { $ref: "#/components/schemas/workflow_start_receipt" }
        "409":
          description: 同一 task_id 已在飞（重复派发）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/error" }
components:
  schemas:
    report_compose_spec:
      type: object
      required: [report_id, domains, package]
      properties:
        report_id:
          type: string
          description: 本次生成的定址 id（project-svc 铸造的 ULID，26 字符）；workflow id 由其派生。
        domains:
          type: array
          items: { type: string }
          description: >-
            本次派发的 dom- 单元集合，由求值线给出。**不从 package 里读**——包内 domains 是求值
            范围，本字段是本次要成文的范围，两者可以不等。
        package:
          type: object
          description: >-
            报告数据包原样载荷。**字段是 camelCase**（schema 见本仓
            `rulebook/report_data_package.schema.json`），与本请求体外层的 snake_case 并存：
            外层是编排侧的模型字段名，内层是求值线的产物契约，两套命名同报文共存是有意的。
            编排侧对它不透明——只搬运，不解包。
        max_rewrites:
          type: integer
          default: 2
          description: 单元出口过检不合格后的重写轮数上限（设计定数，生产调用方不传）。
        max_unit_retries:
          type: integer
          default: 2
          description: >-
            某章终判 failed 后允许的**整章重开**次数上限（编排侧旋钮，生产调用方不传）。
            与 `max_rewrites` 是两个旋钮：那个是 activity 章内的自我修正轮数；这个是章内轮数
            耗尽、整章 failed 之后，编排侧拿同样入参另起一次派发。用户裁决 2026-08-31：
            「失败让重开……单独开失败的这一张就可以了」。
    floorplan_visuals_spec:
      type: object
      required: [task_id, floorplan_object_key, result_callback_url]
      properties:
        task_id:
          type: string
          description: 生成任务 id（project-svc 铸造的 ULID，26 字符）；workflow id 由其派生。
        floorplan_object_key:
          type: string
          description: >-
            用户上传的户型图在私有桶里的键（`uploads/{content_sha256}/original.{ext}`，
            registries/object_keys.md）。全部派生产物落同一前缀。
        building_area_sqm:
          type: number
          description: 业主给的建筑面积，平方米；缺省＝不给（批注与文案就不提面积）。
        floor_area_ratio_percent:
          type: number
          description: 得房率百分数（业务侧推的，默认 80）；缺省＝不给。
        result_callback_url:
          type: string
          description: >-
            结果回流地址（由派发方注入，编排侧不知道业务侧在哪）。完整 URL，编排侧
            `task-result-deliver` activity 以 `POST` 把 project.v1 `generation_task_result` 送到这里。
        templates:
          type: object
          description: 覆盖默认模板组合（生产调用方不传；默认在编排侧配置：mood=cream-journal, style=lifestyle-notebook-handwritten）
          properties:
            mood: { type: string }
            style: { type: string }
    floorplan_visuals_product:
      type: string
      description: >-
        三张图生成线交回的产物词表（只增不改）。业务侧把它映射成自己的 artifact_type。
        mood_image=情绪图（风格底图 + 叠字成品）；brief_image=功能说明图；style_image=手账写字版风格图；
        plan_master=母版；floorplan_geometry=几何 JSON（含勘测）；floorplan_reading=户型特征解析 JSON。
      enum: [mood_image, brief_image, style_image, plan_master, floorplan_geometry, floorplan_reading]
    workflow_start_receipt:
      type: object
      required: [workflow_id, run_id]
      properties:
        workflow_id: { type: string }
        run_id:
          type: string
          description: 可能为空串（编排侧拿不到 run 号时）。空定址不代表派发失败。
    error:
      type: object
      properties:
        detail: { type: string }
