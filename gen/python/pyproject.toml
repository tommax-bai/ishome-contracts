# ishome contracts Python SDK（生成代码在 ishome/，由 buf generate 产出，手改无效）
# GitHub Packages 不支持 PyPI —— 消费方式为 git 依赖：
#   uv add "ishome-contracts @ git+ssh://git@github.com/tommax-bai/ishome-contracts.git#subdirectory=gen/python"
# 是否另建私有 PyPI 属后置决策（见中控仓《落地假设与拍板清单》）。
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ishome-contracts"
version = "0.1.0"
description = "ishome contracts Python SDK (generated by buf, do not edit)"
requires-python = ">=3.12"
dependencies = [
    "protobuf>=7.36",
    "grpcio>=1.66",
]

[tool.setuptools.packages.find]
include = ["ishome*"]
namespaces = true

# pyi 存根与 PEP 561 标记随 wheel 分发（缺这段 mypy 会把本包当无类型）
[tool.setuptools.package-data]
"*" = ["*.pyi", "py.typed"]
