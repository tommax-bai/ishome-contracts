syntax = "proto3";

package ishome.channel.v1;

// 能力声明（capability descriptor）——渠道间真正的差异是能力不是格式（对齐文档 §6.3）。
// design-svc 只查能力、按能力降级：无卡片→纯链接；无主动窗口→排队等用户下次发言，或降级触达级渠道召回。
// 能力缺失时的降级决策集中在策略引擎一处，不散落在各调用点（规范 R5：按能力分支，不按身份分支）。
message ChannelCapability {
  // 主动发送（飞书应用可用范围内 true；微信系受发送窗口限制）
  bool can_send_proactive = 1;
  // 发送窗口/频率/配额规则引用——触达策略引擎的策略数据键。
  // 各平台规则做成策略数据不写死代码，规则变更只改配置（对齐 §6.3-3）。
  string proactive_policy_ref = 2;
  bool supports_card = 3;
  bool supports_quick_reply = 4;
  // 渠道协议能力的客观描述（如飞书支持拉群=GROUP）。
  // 产品不使用此能力（V1.3：系统无转人工）；字段保留仅因它是渠道属性，不是产品承诺。
  HumanTakeover human_takeover = 5;
  MediaLimits media_limits = 6;
  // 渠道分级（对齐 §6.3）：会话级门槛 = text + image + link，能承载设计流程；
  // 触达级（短信、订阅消息）只出不进，只能通知召回。低于会话级门槛的渠道不允许承载设计会话。
  ChannelGrade channel_grade = 7;
}

enum HumanTakeover {
  HUMAN_TAKEOVER_UNSPECIFIED = 0;
  HUMAN_TAKEOVER_NONE = 1;
  // 渠道原生座席（如企微）
  HUMAN_TAKEOVER_NATIVE = 2;
  // 拉群共处（如飞书）
  HUMAN_TAKEOVER_GROUP = 3;
  // 自建座席控制台
  HUMAN_TAKEOVER_CONSOLE = 4;
}

enum ChannelGrade {
  CHANNEL_GRADE_UNSPECIFIED = 0;
  // 会话级：可承载设计会话
  CHANNEL_GRADE_SESSION = 1;
  // 触达级：只出不进（outbound-only adapter，会话的退化形态）
  CHANNEL_GRADE_TOUCH = 2;
}

// 图片/文件/音频尺寸与类型限制（以各开放平台现行限制为准，落地时核实——对齐 §6.7）
message MediaLimits {
  uint64 image_max_bytes = 1;
  repeated string image_mime_types = 2;
  uint64 file_max_bytes = 3;
  repeated string file_mime_types = 4;
  uint64 audio_max_bytes = 5;
  repeated string audio_mime_types = 6;
}
